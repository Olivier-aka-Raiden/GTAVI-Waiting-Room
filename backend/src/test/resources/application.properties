# ============================================================
# GTA VI Waiting Room — Test Configuration
# ============================================================
# Redis Dev Services auto-starts a container when no host is configured AND
# Docker is running. Start Docker Desktop (Linux containers) before tests.
# Without Docker, supply %test.quarkus.redis.hosts for a dedicated test Redis.

%test.quarkus.redis.devservices.enabled=true
gtavi.redis.key-prefix=gtavi:test

# Disable LangChain4j during tests
quarkus.langchain4j.openai.api-key=test-key-not-used
quarkus.langchain4j.openai.base-url=http://127.0.0.1:9
quarkus.langchain4j.openai.timeout=1s

# Disable AI monitoring during tests
gtavi.monitoring.enabled=false
gtavi.snapshots.retention-days=30

# Disable FCM during tests
gtavi.fcm.enabled=false
gtavi.notifications.max-attempts=3
gtavi.notifications.retry-base-seconds=0
gtavi.notifications.retry-max-seconds=0
gtavi.notifications.outbox-batch-size=100
gtavi.notifications.delivery-lease-seconds=30

# Test internal secret
gtavi.internal.shared-secret=test-secret

# Quieter logs in tests
quarkus.log.level=WARN
quarkus.log.category."com.gtavi".level=INFO
