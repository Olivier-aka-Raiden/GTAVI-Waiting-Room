services:
  redis:
    image: redis:7.4-alpine
    container_name: gtavi-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  gtavi-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gtavi-api
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0
      - UPSTASH_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
